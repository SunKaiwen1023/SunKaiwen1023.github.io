<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaiwen Sun Portfolio</title>
<meta name="description" content="Kaiwen (Serena) Sun — computational designer at Carnegie Mellon. Robotics, computer vision, and design automation for architecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   TOKENS — paper white, green-biased neutrals, mint #52F7A8.
   Mint is a FILL, never small text; --mint-deep carries accent text.
   ============================================================ */
:root{
  --paper:#ffffff;
  --paper-2:#f4f7f5;
  --ink:#0c0f0d;
  --ink-2:#55605a;
  --ink-3:#8b948f;
  --rule:#dde3de;
  --mint:#52f7a8;
  --mint-deep:#067a45;
  --mint-wash:#eafff4;

  --ff-sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

 --fs-display:clamp(2.0rem,3.8vw,3.35rem);
  --fs-h1:clamp(1.85rem,3.8vw,2.9rem);
  --fs-h2:clamp(1.3rem,2.1vw,1.75rem);
  --fs-h3:1.08rem;
  --fs-body:clamp(1.0625rem,1.1vw,1.125rem);
  --fs-small:0.875rem;
  --fs-micro:0.75rem;

  --pad:clamp(20px,4.4vw,56px);
  --maxw:1400px;
  --gap:clamp(24px,3vw,48px);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ff-sans);font-size:var(--fs-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--mint-deep);outline-offset:3px;border-radius:2px}

.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.mono{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase}

/* ============================================================ HEADER */
.site-head{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule);
}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:.95rem}
.brand .chip{width:9px;height:9px;background:var(--mint);border-radius:1px;flex:none}
.nav{display:flex;align-items:center;gap:clamp(14px,2vw,28px)}
.nav a{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);padding:6px 0;position:relative;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--ink);transition:right .3s cubic-bezier(.2,.7,.2,1)}
.nav a:hover::after,.nav a[aria-current="page"]::after{right:0}
.nav a[aria-current="page"]{color:var(--ink)}
.nav .ext::before{content:"↗";margin-right:4px;font-size:.9em;opacity:.6}

/* ============================================================ HERO */
.hero{padding-block:clamp(48px,8vw,110px) clamp(36px,5vw,64px)}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--ink-2);margin-bottom:clamp(22px,3.6vw,36px)}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px var(--mint-wash);flex:none}
.hero h1{font-size:var(--fs-display);font-weight:500;line-height:1.12;letter-spacing:-.038em;max-width:26ch;text-wrap:pretty}
.hi{background:var(--mint);border-radius:2px;white-space:nowrap;box-shadow:.12em 0 0 var(--mint),-.12em 0 0 var(--mint);-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* ---------- HERO: funicular field ---------- */
.hero-stage{
  position:relative;
  min-height:clamp(240px,26vw,360px);
  display:flex;flex-direction:column;
}
#heroCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero-stage .eyebrow,.hero-stage h1{position:relative;z-index:1}
.hero-state{
  position:absolute;right:0;bottom:0;z-index:1;pointer-events:none;
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
@media (max-width:520px){.hi{white-space:normal}}
@media (max-width:640px){.hero-stage{min-height:clamp(240px,58vw,360px)}.hero-state{display:none}}

.hero-foot{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--gap);
  margin-top:clamp(32px,5vw,58px);padding-top:22px;border-top:1px solid var(--rule);
}
.hero-foot p{color:var(--ink-2);font-size:var(--fs-small);max-width:36ch;margin:0}
.hero-foot .k{color:var(--ink-3);display:block;margin-bottom:8px}
.hero-foot .v{color:var(--ink);font-size:var(--fs-small)}

/* ============================================================ SECTIONS */
.sec{padding-block:clamp(40px,5.5vw,72px)}
.sec+.sec{padding-top:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:var(--fs-h2);font-weight:500;letter-spacing:-.02em}
.sec-head .count{color:var(--ink-3)}

/* ============================================================ PROJECT INDEX */
.index{border-top:1px solid var(--ink)}
.row{
  display:grid;
  grid-template-columns:3.4rem minmax(0,1.1fr) minmax(0,1fr) 5.2rem;
  align-items:center;gap:16px;
  padding:clamp(15px,1.9vw,21px) 0;border-bottom:1px solid var(--rule);
}
.row .num{font-family:var(--ff-mono);font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.04em}
.row .ttl{font-size:clamp(1.1rem,1.8vw,1.5rem);font-weight:500;letter-spacing:-.022em;display:flex;align-items:center;gap:10px;min-width:0}
.row .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl::after{content:"";width:6px;height:6px;background:var(--mint);border-radius:1px;flex:none;opacity:0;transform:translateX(-6px);transition:all .3s cubic-bezier(.2,.7,.2,1)}
.tags{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px}
.tags i{font-style:normal;color:var(--rule)}
.row .yr{font-family:var(--ff-mono);font-size:var(--fs-micro);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.row .thumb{display:none}
.wip{display:inline-block;font-family:var(--ff-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-deep);border:1px solid var(--mint);border-radius:2px;padding:2px 5px;vertical-align:middle}

/* hover preview (desktop) */
.peek{
  position:fixed;top:0;left:0;z-index:40;width:min(340px,26vw);aspect-ratio:16/9;
  border:1px solid var(--rule);background:var(--paper-2);
  opacity:0;transform:translate3d(-9999px,-9999px,0) scale(.96);
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.7,.2,1);
  pointer-events:none;overflow:hidden;
}
.peek.on{opacity:1}
.peek img{width:100%;height:100%;object-fit:cover}

/* ============================================================ PROJECT CARDS */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,1.8vw,28px)}
.card{display:grid;gap:12px;align-content:start}
.card .shot{overflow:hidden;border:1px solid var(--rule);background:var(--paper-2);aspect-ratio:4/3}
.card .shot img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.card:hover .shot img{transform:scale(1.045)}
.card:hover .shot{border-color:var(--ink-3)}
/* subgrid keeps titles and descriptions aligned across a row of cards */
@supports (grid-template-rows:subgrid){
  .grid{grid-auto-rows:auto}
  .card{grid-row:span 5;grid-template-rows:subgrid;gap:10px}
  .card .shot{margin-bottom:2px}
}
.card .meta-line{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase;font-variant-numeric:tabular-nums}
.card .pills{display:flex;align-items:flex-start;align-content:flex-start;flex-wrap:wrap;gap:5px}
.card .pill{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:2px;padding:3px 7px;line-height:1.35}
.card:hover .pill{border-color:var(--ink-3)}
.card h3{font-size:1.08rem;font-weight:600;letter-spacing:-.018em;line-height:1.25;display:flex;gap:8px;align-items:baseline}
.card h3::after{content:"";width:6px;height:6px;background:var(--mint);border-radius:1px;flex:none;opacity:0;transform:translateX(-5px);transition:all .3s cubic-bezier(.2,.7,.2,1)}
.card:hover h3::after{opacity:1;transform:none}
.card p{font-size:var(--fs-small);color:var(--ink-2);margin:0;line-height:1.45}
.card .shot.fit-contain,.p-hero.fit-contain{background:var(--paper)}
.card .shot.fit-contain img,.p-hero.fit-contain img{object-fit:contain;background:var(--paper)}
.card:hover .shot.fit-contain img{transform:scale(1.02)}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

/* ============================================================ FILTERS */
.filterbar{display:grid;gap:12px;margin-bottom:26px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow>.lbl{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);width:72px;flex:none}
.frow button{
  font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase;
  padding:6px 11px;border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  cursor:pointer;border-radius:2px;transition:all .2s ease;
}
.frow button:hover{border-color:var(--ink);color:var(--ink)}
.frow button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.frow.methods button[aria-pressed="true"],
.frow.years button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ============================================================ ABOUT / LISTS */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--gap);border-top:1px solid var(--ink);padding-top:24px}
.col h3{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:12px}
.col li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-small)}
.col li:last-child{border-bottom:0}
.col li em{font-style:normal;color:var(--ink-3);display:block;font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.07em;margin-top:2px;white-space:pre-line}
.lede{font-size:clamp(1.05rem,1.8vw,1.4rem);line-height:1.42;letter-spacing:-.015em;max-width:34ch;font-weight:400}
.body-copy{max-width:64ch;color:var(--ink-2)}
.body-copy p+p{margin-top:1em}
.cols.about-cols{grid-template-columns:minmax(0,0.85fr) minmax(0,1.4fr) minmax(0,1.4fr)}
.portrait{margin:0;max-width:240px}
.portrait .frame{display:block;border:1px solid var(--rule);background:var(--paper-2);overflow:hidden;aspect-ratio:4/5}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait figcaption{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.07em;color:var(--ink-3);margin-top:9px;line-height:1.5}
@media (max-width:900px){.cols.about-cols{grid-template-columns:minmax(0,1fr)}}
.cols.home-cols{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1.1fr)}
@media (max-width:900px){.cols.home-cols{grid-template-columns:minmax(0,1fr)}}

/* ============================================================ PROJECT PAGE */
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);padding-block:clamp(22px,3.4vw,36px) 0}
.back:hover{color:var(--ink)}
.p-head{padding-block:clamp(20px,2.6vw,30px) clamp(22px,2.8vw,32px)}
.p-head h1{font-size:var(--fs-h1);font-weight:500;letter-spacing:-.032em;line-height:1.03;max-width:18ch;text-wrap:balance}
.p-head .sub{margin-top:14px;color:var(--ink-2);max-width:54ch}
.p-hero{border:1px solid var(--rule);aspect-ratio:16/9;overflow:hidden;background:var(--paper-2)}
.p-top{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
  gap:clamp(24px,3.5vw,56px);align-items:center;
  padding-block:clamp(20px,2.6vw,30px) 0;
}
.p-top .p-head{padding-block:0}
@media (max-width:900px){
  .p-top{grid-template-columns:minmax(0,1fr);align-items:start;gap:clamp(18px,2.4vw,26px)}
}
.p-hero img{width:100%;height:100%;object-fit:cover}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:var(--gap);border-top:1px solid var(--ink);margin-top:clamp(26px,3.6vw,42px);padding-top:20px}
.meta .k{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px}
.meta .v{font-size:var(--fs-small)}
.p-body{display:grid;gap:clamp(30px,4.4vw,52px);padding-block:clamp(36px,5vw,64px)}
.blk{display:grid;gap:13px}
.blk h2{font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em;max-width:44ch}
.blk .tagline{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--mint-deep)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
/* ---------- custom block layouts ---------- */
.lay{display:grid;gap:clamp(14px,1.6vw,22px)}
.lay .fig{margin:0}
.lay .fig img{width:100%;height:auto;display:block;border:1px solid var(--rule);background:var(--paper)}
.lay .fig video{width:100%;height:auto;display:block;border:1px solid var(--rule);background:var(--paper)}
.lay .fig.sq img{aspect-ratio:1/1;object-fit:cover}
.lay .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.8fr);gap:clamp(18px,2.4vw,40px);align-items:start}
.lay .txt{display:grid;gap:13px;align-content:start}
.lay .txt h2{font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em}
.lay .stack{display:grid;gap:clamp(14px,1.6vw,22px)}
.lay .pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.6vw,22px)}
.lay .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,2.8vw,48px);align-items:start}
/* grouped sections — a hairline marks where one band ends and the next begins */
.lay .sect{display:grid;gap:clamp(14px,1.6vw,22px);padding-top:clamp(20px,2.4vw,34px);border-top:1px solid var(--rule)}
.lay .sect:first-child{padding-top:0;border-top:0}
/* two columns 1:2 — rows split 2:1 on the left, 1:2 on the right */
.lay .mosaic{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);
  grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(14px,1.6vw,22px);aspect-ratio:10/7;
}
.lay .mosaic .m1{grid-column:1;grid-row:1/3}
.lay .mosaic .m2{grid-column:1;grid-row:3/4}
.lay .mosaic .m3{grid-column:2;grid-row:1/2}
.lay .mosaic .m4{grid-column:2;grid-row:2/4}

/* figures that fill the full row height, image cropped to fit */

.lay .row.fill{align-items:stretch}
.lay .row.fill .pair{align-items:stretch}
.lay .pair{align-items:stretch}
.lay .fig.fill{display:flex;flex-direction:column;min-height:0}
.lay .fig.fill img{flex:1 1 auto;min-height:0;height:auto;object-fit:contain;background:var(--paper)}
.lay .btn{justify-self:center;display:inline-flex;align-items:center;gap:9px;font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:2px;padding:13px 26px;margin-top:clamp(8px,1.4vw,18px);transition:background .2s ease,color .2s ease}
.lay .btn:hover{background:var(--ink);color:var(--paper)}
.lay .gal{display:grid;gap:clamp(10px,1.2vw,16px);aspect-ratio:8/1}
.lay .gal.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.lay .gal.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.lay figcaption{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin-top:8px}
@media (max-width:820px){
  .lay .gal{aspect-ratio:auto}
  .lay .gal.six,.lay .gal.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lay .row,.lay .trio,.lay .pair{grid-template-columns:minmax(0,1fr)}
  .lay .mosaic{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;aspect-ratio:auto}
  .lay .mosaic .m1,.lay .mosaic .m2,.lay .mosaic .m3,.lay .mosaic .m4{grid-column:1;grid-row:auto}
}
.figure{border:1px solid var(--rule);background:var(--paper-2);overflow:hidden;aspect-ratio:16/9}
.figure img{width:100%;height:100%;object-fit:cover}
.note-inline{border-left:2px solid var(--mint);background:var(--mint-wash);padding:14px 16px;font-size:var(--fs-small);color:var(--ink-2);max-width:60ch}
.next{border-top:1px solid var(--ink);padding-block:clamp(24px,3.6vw,38px)}
.next a{display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.next .t{font-size:var(--fs-h2);font-weight:500;letter-spacing:-.025em}
.next a:hover .t{color:var(--mint-deep)}

/* ============================================================ FOOTER */
.site-foot{border-top:1px solid var(--ink);padding-block:clamp(34px,4.6vw,56px) 28px;margin-top:clamp(28px,4vw,48px)}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--gap)}
.foot-grid h3{font-family:var(--ff-mono);font-size:var(--fs-micro);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:12px}
.foot-grid a{display:block;padding:5px 0;font-size:var(--fs-small);color:var(--ink-2)}
.foot-grid a:hover{color:var(--ink)}
.foot-cta{font-size:clamp(1.5rem,3.6vw,2.8rem);font-weight:500;letter-spacing:-.03em;line-height:1.04}
.foot-cta a:hover{color:var(--mint-deep)}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:clamp(30px,4.4vw,50px);color:var(--ink-3)}
.note{border-left:2px solid var(--mint);background:var(--mint-wash);padding:12px 14px;margin-top:26px;font-size:var(--fs-small);color:var(--ink-2);max-width:72ch}
.note b{color:var(--ink);font-weight:600}
.note code{font-family:var(--ff-mono);font-size:.9em;background:var(--paper);padding:1px 5px;border:1px solid var(--rule);border-radius:2px}

/* ============================================================ CURSOR */
.cur,.cur-dot{position:fixed;top:0;left:0;z-index:90;pointer-events:none;will-change:transform}
.cur{
  width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;
  transition:width .3s cubic-bezier(.2,.7,.2,1),height .3s cubic-bezier(.2,.7,.2,1),
             margin .3s cubic-bezier(.2,.7,.2,1),background-color .3s ease,border-color .3s ease,opacity .2s ease;
}
.cur-dot{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--ink);border-radius:50%;transition:opacity .2s ease}
.cur .lbl{font-family:var(--ff-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .2s ease;color:var(--ink)}
body.cur-link .cur{width:34px;height:34px;margin:-17px 0 0 -17px;background:color-mix(in srgb,var(--mint) 34%,transparent);border-color:var(--mint)}
body.cur-link .cur-dot{opacity:0}

            <div class="txt">
              <p class="tagline">The challenge</p>
              <h2>Speed and accuracy pull against each other on a moving belt</h2>
              <p class="body-copy">Conventional AI systems create processing bottlenecks in high-speed industrial settings. A recycling facility's conveyor runs at 2 m/s, and putting a full segmentation network on every frame forces a trade between throughput and classification accuracy, you get one or the other.</p>

              <p class="tagline" style="margin-top:22px">The approach</p>
              <h2>You don't need deep learning everywhere — you need it where it matters</h2>
              <p class="body-copy">The pipeline splits in two after preprocessing and calibration. A classical branch handles what classical computer vision is good at: thresholding, morphology and contour analysis for rapid foreground segmentation, plus optical-flow slip detection for belt-health diagnostics. YOLOv8-seg then runs only on the regions of interest that branch identifies, rather than on whole frames, cutting the computational workload by over 80%.</p>
            </div>

            <div class="pair" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
              <figure class="fig fill">
                <img src="images/computation/CV/CV_masking.png" alt="Masking stages">
                <figcaption>Masking and contour isolation</figcaption>
              </figure>
              <figure class="fig fill">
                <img src="images/computation/CV/workflow.png" alt="Pipeline diagram">
                <figcaption>Dual-branch pipeline</figcaption>
              </figure>
            </div>
          </div>

          <div class="row" style="grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)">
            <figure class="fig">
              <img src="images/computation/CV/compare_chart.png" alt="Performance comparison">
              <figcaption>Hybrid vs. single-method performance</figcaption>
            </figure>

            <div class="txt">
              <p class="tagline">Result</p>
              <h2>60+ FPS at over 95% classification accuracy</h2>
              <p class="body-copy">The system holds real-time frame rates while reporting live performance metrics, and the hybrid outperforms either method used alone. Neither branch is doing the other's job: the classical stage never tries to name a material, and the network never wastes compute on empty belt.</p>

              <h2>Form found in RhinoVAULT so every part stays in compression</h2>
              <p class="body-copy">The bench's geometry comes out of funicular form finding: shaped so the load path stays in compression throughout, which is what allows a dry-fit assembly to stand without adhesives or fasteners. Karamba finite element analysis and panelization confirmed the surface before anything was cut.</p>
            </div>
            <div class="txt">
              <p class="tagline">Path planning</p>
              <h2>Custom Grasshopper toolpaths, one per unique piece</h2>
              <p class="body-copy">Every component has a different geometry, so every component needs its own milling toolpath. We wrote custom robotic kinematics in Grasshopper to drive an ABB 4400 industrial arm against the specific geometry of each block.</p>
            </div>
            <div class="txt">
              <p class="tagline">Digital to physical</p>
              <h2>3D-printed study models, then full-scale legs in wood</h2>
              <p class="body-copy">A printed piece matrix let us test the dry-fit logic at small scale before committing to milled timber. The full-scale leg assembled as designed, which is the whole argument: precision in the toolpath is what buys you a structure that needs no glue.</p>
            </div>
          </div>

                <h2>A force sensor under wool, a ring of light, and a heater that melts wax</h2>
                <p class="body-copy">A Force Sensitive Resistor (FSR 406) sits beneath a wool cover and reads squeeze pressure. A 16-LED NeoPixel ring (WS2812B) is the visual output. A polyimide flexible heater plate warms a lavender wax core, so the object can answer in scent and heat rather than only in light. The Particle Photon 2 was chosen for cloud connectivity fast enough for a real-time hand-holding simulation.</p>

                <p class="body-copy">Boolean logic separates the two states. A single user's touch produces ambient purple light: presence. When both partners hold their object at the same time, the light brightens and the heater releases warmth and lavender scent: connection. The distinction is the whole interaction design: being thought of, versus being met.</p>

    sub:"Dense 3D point clouds reconstructed from ordinary pairs of photographs.",
    meta:{Role:"Individual project",Instructor:"Kenji Shimada",Context:"24678 · Computer Vision for Engineers · CMU",Stack:"Python, OpenCV SGBM, CloudCompare",Completed:"Nov 2025"},
    blocks:[
      {html:`
        <div class="lay">

          <div class="pair">
            <div class="txt">
              <p class="tagline">Pipeline</p>
              <h2>Two photographs, one measurable surface</h2>
              <p class="body-copy">I developed a high-performance Stereo Vision pipeline in Python to reconstruct dense 3D point clouds from unconstrained 2D image pairs. To handle the noise and lighting variability of real-world environments, I used the Semi-Global Block Matching (SGBM) algorithm, calibrated through a custom interactive tuning tool (parameters.py) to optimize block size and disparity thresholds. The pipeline converts 2D disparity maps into spatial coordinates using a manual inverse-depth projection, then exports high-resolution .ply files for geometric analysis in CloudCompare. A robust filtering system mitigates artifacts in low-texture regions, carrying the result from raw pixel data to accurate 3D surface meshes.</p>
            </div>

    id:"perspective-rectifier", cat:"Computation", title:"Perspective Rectifier", year:"2026",
    image:"images/computation/perspective/perspective_profile.gif", fit:"contain",
    tags:["Computer Vision","Computer Graphics","Tooling"],
    sub:"Recovering true geometry from a photograph taken at an angle.",
    meta:{Role:"Individual Project",Instructor:"Chris McComb",Context:"24679 · Designing and Prototyping AI Systems · CMU",Stack:"Python, OpenCV, Gradio, NumPy/SciPy",Completed:"Sep 2026"},
    metaSpan:{Context:2},
    blocks:[
      {html:`
        <div class="lay">
          
          <div class="row" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">
          
            <div class="stack">
              <div class="txt">
                <p class="tagline">The manual way</p>
                <h2>Lightroom's auto-correction fails silently</h2>
                <p class="body-copy">Lightroom will attempt the correction for you, but when it misreads a facade it shows nothing of what it detected and gives you no way in. The only recourse is the sliders, nudged by eye — which takes both a trained eye and some prior idea of what the geometry ought to be.</p>

                <p class="tagline" style="margin-top:22px">Tool</p>
                <h2>A perspective corrector that shows its reasoning</h2>
                <p class="body-copy">This tool detects the straight edges in an image with OpenCV's Line Segment Detector, groups them by sequential RANSAC into families converging on a shared vanishing point, and recovers the camera's focal length from that geometry alone, to within 0.1–1.3% on the test images. Because the correction is derived rather than dialled in, it can rectify to a chosen target: the facade plane, the ground plane, vertical-only, or a custom one. Export re-warps the original upload rather than upscaling the preview, so nothing is lost to the working resolution.</p>

                <p class="tagline" style="margin-top:22px">Correction</p>
                <h2>The detector's real enemy is vegetation</h2>
                <p class="body-copy">A tree branch reads like a structural edge. Rather than tune thresholds until it mostly works, the overlay is interactive: every detected line is drawn on the photograph, colour-coded by vanishing-point family, and you click away the ones you disagree with. Those corrections train a logistic-regression classifier on edge geometry, so the same clutter is filtered automatically elsewhere in the frame. It runs locally behind a Gradio interface: no model weights, no API keys, nothing uploaded anywhere.</p>
              </div>

              <a class="btn" data-cur="link" style="justify-self:start" href="https://github.com/SunKaiwen1023/Perspective-Rectifier" target="_blank" rel="noopener">Source on GitHub <span aria-hidden="true">↗</span></a>
            </div>

            <div class="stack">
              <figure class="fig">
                <video src="images/computation/perspective/LR.mp4" muted loop autoplay playsinline preload="metadata"></video>
                <figcaption>Regular Lightroom workflow</figcaption>
              </figure>
              <figure class="fig">
                <video src="images/computation/perspective/demo.mp4" muted loop autoplay playsinline preload="metadata"></video>
                <figcaption>Complete tool demonstration</figcaption>
              </figure>
            </div>

          </div>

          <figure class="fig">
            <img src="images/computation/perspective/gallery.jpg" alt="Before and after rectification">
            <figcaption>Corrected images gallery, cr. Kaiwen (Serena) Sun, Washington DC, 2026</figcaption>
          </figure>

        </div>`}
    ]

    id:"robotic-drawing-25d", cat:"Computation", title:"2.5D Robotic Drawing", year:"2024",
    image:"images/computation/2.5D/2.5D_profile.gif", tags:["Robotics","Fabrication","Computer Graphics"],
    sub:"A robot that draws on surfaces that are not flat.",
    meta:{Collaborators:"Julia Kasper, Ternilla Robinson",Instructor:"Joshua Bard",Context:"48555 · Intro to Architectural Robotics · CMU",Stack:"ABB IRB 120, RobotStudio, Robot Components for Grasshopper",Completed:"Oct 2024"},
    // metaSpan:{Stack:2},
    blocks:[
      {html:`
        <div class="lay">

          <figure class="fig">
            <img src="images/computation/2.5D/workflow.png" alt="Workflow diagram">
            <figcaption>End-to-end workflow, scan to RAPID</figcaption>
          </figure>

          <div class="row">

            <div class="txt">
              <p class="tagline">Problem</p>
              <h2>Drawing machines assume the paper is flat</h2>
              <p class="body-copy">The system generates drawing trajectories autonomously on non-standard, non-planar physical geometry — a mesh with stochastic deformation rather than a sheet. Every assumption a plotter makes about a constant working plane stops being true.</p>

              <p class="tagline" style="margin-top:18px">Method</p>
              <h2>Scan the surface, project the contours, plan for depth</h2>
              <p class="body-copy">Point-cloud scanning captures the deformed mesh, and topographical contour information is projected onto that surface to generate the path. Motion planning then handles variable depths and complex fold patterns so the end effector keeps contact through high-curvature regions instead of skipping or digging in.</p>

              <p class="tagline" style="margin-top:18px">Calibration</p>
              <h2>Closing the gap between the simulation and the arm</h2>
              <p class="body-copy">Tool calibration and work object definition resolve the digital-to-physical discrepancies that otherwise accumulate into a visibly wrong drawing. Paths are generated as RAPID code and simulated in RobotStudio before running on the ABB IRB 120.</p>
            </div>

            <div class="stack">
              <figure class="fig">
                <img src="images/computation/2.5D/draw.gif" alt="Robot drawing">
                <figcaption>ABB IRB 120 drawing on the deformed surface</figcaption>
              </figure>
              <div class="pair">
                <figure class="fig sq"><img src="images/computation/2.5D/output.jpg" alt="Output"></figure>
                <figure class="fig sq"><img src="images/computation/2.5D/setting.jpg" alt="Setup"></figure>
              </div>
            </div>

          </div>
        </div>`}

    image:"images/architecture/terralogic/profile_4.jpg",
    tags:["Public","Structures","Fabrication"],
    sub:"A visitor center whose geometry and terracotta façade are both derived from how crystals grow.",
    meta:{Collaborator:"Andrew Wang",Instructor:"Laura Garofalo",Context:"48550",Site:"Laurel Caverns, Pennsylvania",Completed:"May 2026"},
    blocks:[
      {html:`
        <div class="lay">

          <div class="trio">
            <div class="txt">
              <p class="tagline">Site</p>
              <h2>A building that hands you over to the cavern</h2>
              <p class="body-copy">The project sits at Laurel Caverns, positioned along the natural water path and existing road network so that access, parking and circulation all frame entry toward the caves. The section is the argument: a continuous vertical sequence runs from the atrium down past a small theatre beneath the gallery and further into the cavern itself, so the architecture works as a transition into a subterranean condition rather than a destination of its own.</p>
            </div>

            <div class="txt">
              <p class="tagline">Form</p>
              <h2>Program mapped, rotated for sun, then opened and stitched by an atrium</h2>
              <p class="body-copy">Form generation ran as an explicit sequence: major program elements mapped and resized into volumetric masses, rotated to optimize sunlight, views and entry, then carved with strategic openings to bring daylight to key spaces. A central glass atrium finally connects the volumes, carrying circulation and visual continuity across exhibition, auditorium, café, reception, and the office and education spaces consolidated below.</p>
            </div>

            <div class="txt">
              <p class="tagline">Façade</p>
              <h2>Seven panel variations, one gradient, a constructible detail</h2>
              <p class="body-copy">The terracotta façade abstracts the crystalline precedent into a systematic field of triangulated 2' × 2' panels whose depth varies by about an inch. Seven variations (A–G) generate a controlled gradient from least to most pronounced deformation, enough variation to read as a surface, few enough moulds to actually fabricate. Panels hook onto an aluminum railing and vertical carrier track anchored to a concrete wall with rigid insulation, and their offset depth creates a ventilated cavity behind.</p>
            </div>
          </div>

            <div class="txt">
              <p class="tagline">Ambition</p>
              <h2>The land itself as the outcome of the design</h2>
              <p class="body-copy">Through minimal, adaptive interventions, the project imagines environmental recovery, cultural continuity and future resilience as one evolving system rather than three separate briefs.</p>

            <div class="txt">
              <p class="tagline">Concept</p>
              <h2>A necklace of interventions rather than a single building</h2>

   ============================================================ */
const MINT="#52f7a8", INK="#0c0f0d", GREY="#c9d1cc", PAPER="#f4f7f5";
function art(i,w=1200,h=675){
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${PAPER}"/>`;
  const m=i%6;
  if(m===0){ for(let x=0;x<26;x++)for(let y=0;y<15;y++){const on=(x===16&&y>3&&y<10);s+=`<circle cx="${46+x*44}" cy="${44+y*44}" r="${on?8:3.2}" fill="${on?MINT:GREY}"/>`;} }
  else if(m===1){ for(let r=50;r<820;r+=48) s+=`<circle cx="${w*0.62}" cy="${h*0.55}" r="${r}" fill="none" stroke="${r===338?MINT:GREY}" stroke-width="${r===338?7:1.4}"/>`; }
  else if(m===2){ for(let x=-h;x<w;x+=26) s+=`<line x1="${x}" y1="0" x2="${x+h}" y2="${h}" stroke="${GREY}" stroke-width="1.4"/>`; s+=`<rect x="${w*0.18}" y="${h*0.34}" width="${w*0.48}" height="${h*0.2}" fill="${MINT}"/>`; }
  else if(m===3){ let p=40; for(let k=0;k<8;k++){ s+=`<rect x="${p}" y="${p*0.62}" width="${w-p*2}" height="${h-p*1.24}" fill="none" stroke="${k===3?MINT:GREY}" stroke-width="${k===3?7:1.4}"/>`; p+=44; } }
  else if(m===4){ for(let x=0;x<17;x++)for(let y=0;y<10;y++){const r=2+((x+y)%9)*2.4;s+=`<circle cx="${60+x*68}" cy="${58+y*68}" r="${r}" fill="${(x+y)%9===8?MINT:INK}" opacity="${(x+y)%9===8?1:0.13}"/>`;} }
  else { for(let k=0;k<20;k++){const y=32+k*32;s+=`<path d="M0 ${y} Q ${w*0.25} ${y-54+k*3}, ${w*0.5} ${y} T ${w} ${y}" fill="none" stroke="${k===10?MINT:GREY}" stroke-width="${k===10?6:1.3}"/>`;} }
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s+`</svg>`);
}

/* ============================================================
   HERO — funicular field
   A hanging cable net. The cursor acts as a point load and drags
   the strands toward it; scrolling inverts the sag, so the form
   flips from tension (hanging) to compression (arching).
   ============================================================ */
let heroStop=null;
function initHero(){
  if(heroStop){heroStop();heroStop=null;}
  const cv=document.getElementById("heroCanvas");
  if(!cv) return;
  const stage=cv.parentElement, label=document.getElementById("heroState");
  const ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  const STRANDS=13, SAMP=110, PAD=120;
  const INK="#8b948f", MINT="#52f7a8", DEEP="#067a45";
  let W=0,H=0, rects=[], raf=0;
  let tmx=-9999,tmy=-9999, mx=-9999,my=-9999, held=0, theld=0;
  let tp=0, p=0;

  function measure(){
    const r=stage.getBoundingClientRect();
    W=r.width; H=r.height;
    const dpr=Math.min(devicePixelRatio||1,2);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    rects=[...stage.querySelectorAll("h1,.eyebrow")].map(el=>{
      const b=el.getBoundingClientRect();
      return {x:b.left-r.left,y:b.top-r.top,w:b.width,h:b.height};
    });
  }

  /* distance from a point to the text blocks — lines fade out behind type */
  function clear(x,y){
    let d=1e9;
    for(const r of rects){
      const dx=Math.max(r.x-x,0,x-(r.x+r.w));
      const dy=Math.max(r.y-y,0,y-(r.y+r.h));
      d=Math.min(d,Math.hypot(dx,dy));
      if(d===0) return 0.40;
    }
    return 0.40+0.78*Math.min(d/PAD,1);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!W||!H) return;
    const k=1-2*p;                     // +1 hanging, 0 flat, -1 arching
    const top=H*0.10, span=H*0.80;
    let active=-1, best=1e9;
    if(held>0.01){
      for(let i=0;i<STRANDS;i++){
        const y0=top+((i+0.5)/STRANDS)*span;
        const d=Math.abs(y0-my);
        if(d<best){best=d;active=i;}
      }
      if(best>H*0.42) active=-1;
    }

    for(let i=0;i<STRANDS;i++){
      const y0=top+((i+0.5)/STRANDS)*span;
      const sag=(20+58*Math.sin(Math.PI*(i+0.5)/STRANDS))*k;
      const isA=(i===active);
      const pts=[];
      for(let j=0;j<SAMP;j++){
        const t=j/(SAMP-1), x=t*W;
        let y=y0+sag*4*t*(1-t);
        if(held>0.01){
          const dx=(x-mx)/(W*0.17), dy=(y0-my)/(H*0.34);
          const infl=Math.exp(-dx*dx-dy*dy)*held;
          y+=(my-y0)*infl*1.5;
        }
        pts.push([x,y]);
      }
      /* stroke in short segments so opacity can follow the text */
      ctx.lineWidth=isA?1.4:1;
      for(let j=0;j<SAMP-1;j++){
        const a=pts[j], b=pts[j+1];
        const al=clear((a[0]+b[0])/2,(a[1]+b[1])/2);
        ctx.strokeStyle=isA?MINT:INK;
        ctx.globalAlpha=al*(isA?0.95:0.42);
        ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      }
      /* nodes */
      if(i%3===1||isA){
        const n=isA?9:5;
        for(let q=0;q<n;q++){
          const t=(q+1)/(n+1), idx=Math.round(t*(SAMP-1)), [x,y]=pts[idx];
          ctx.globalAlpha=clear(x,y)*(isA?1:0.5);
          ctx.fillStyle=isA?DEEP:INK;
          ctx.beginPath(); ctx.arc(x,y,isA?2.4:1.6,0,6.283); ctx.fill();
        }
      }
    }
    ctx.globalAlpha=1;
    if(label) label.textContent =
      (p<0.34?"Funicular · tension":p<0.66?"Form found · neutral":"Inverted · compression")+
      "  "+String(Math.round(p*100)).padStart(3," ")+"%";
  }

  function tick(){
    mx+=(tmx-mx)*0.14; my+=(tmy-my)*0.14; held+=(theld-held)*0.10;
    p+=(tp-p)*0.09;
    draw();
    raf=requestAnimationFrame(tick);
  }

  const onMove=e=>{
    const r=stage.getBoundingClientRect();
    tmx=e.clientX-r.left; tmy=e.clientY-r.top;
    const inside=tmx>-80&&tmx<W+80&&tmy>-120&&tmy<H+120;
    theld=inside?1:0;
    if(mx<-1000){mx=tmx;my=tmy;}
  };
  const onLeave=()=>{theld=0;};
  const onScroll=()=>{ tp=Math.max(0,Math.min(1,scrollY/Math.max(H*0.58,1))); };
  const onResize=()=>{measure();onScroll();};

  measure(); onScroll(); p=tp;
  if(reduce){ theld=0; held=0; draw(); }
  else{
    addEventListener("mousemove",onMove,{passive:true});
    addEventListener("mouseleave",onLeave,{passive:true});
    tick();
  }
  addEventListener("scroll",onScroll,{passive:true});
  addEventListener("resize",onResize);
  const ro=new ResizeObserver(measure); ro.observe(stage);

  heroStop=()=>{
    cancelAnimationFrame(raf);
    removeEventListener("mousemove",onMove);
    removeEventListener("mouseleave",onLeave);
    removeEventListener("scroll",onScroll);
    removeEventListener("resize",onResize);
    ro.disconnect();
  };
}

/* ============================================================ ROUTER */
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  let html, current="";
  if(parts[0]==="work" && parts[1]==="cat" && parts[2]){
    fCat=decodeURIComponent(parts[2]); fYear="All"; fTag="All";
    html=viewWork(); current="work";
  }
  else if(parts[0]==="work" && parts[1]){ html=viewProject(parts[1]); current="work"; }   // ← this was missing
  else if(parts[0]==="work"){ html=viewWork(); current="work"; }
  else if(parts[0]==="about"){ html=viewAbout(); current="about"; }
  else { html=viewHome(); }
  app.innerHTML=html;
  document.querySelectorAll("#nav a[data-route]").forEach(a=>{
    if(a.dataset.route===current) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
  initHero();
  const f=document.getElementById("filters");
  if(f) f.addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    if(b.dataset.k==="cat"){ fCat=b.dataset.v; fYear="All"; fTag="All"; }
    else if(b.dataset.k==="year"){ fYear=b.dataset.v; }
    else { fTag=b.dataset.v; }
    /* a #/work/cat/... URL re-applies its category on every route(),
       so leave that URL before re-rendering or the filter can never change */
    if(location.hash.startsWith("#/work/cat/")) location.hash="#/work";
    else route();
  });
}
addEventListener("hashchange",route);

    const row=e.target.closest("[data-peek]");
    if(row){ if(peekImg.getAttribute("src")!==row.dataset.peek) peekImg.src=row.dataset.peek; peeking=true; peek.classList.add("on"); }
    else { peeking=false; peek.classList.remove("on"); }
  });
  addEventListener("mouseleave",()=>{document.body.classList.add("cur-hidden");peek.classList.remove("on");peeking=false;});

  (function loop(){
    cx+=(tx-cx)*0.18; cy+=(ty-cy)*0.18;
    cur.style.transform=`translate3d(${cx}px,${cy}px,0)`;
    px+=(tx-px)*0.11; py+=(ty-py)*0.11;
    const w=peek.offsetWidth||320, hg=peek.offsetHeight||180;
    const ox=Math.min(px+28, innerWidth-w-16), oy=Math.min(Math.max(py-hg/2,16), innerHeight-hg-16);
    peek.style.transform=`translate3d(${ox}px,${oy}px,0) scale(${peeking?1:0.96})`;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
